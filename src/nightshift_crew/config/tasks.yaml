# 《夜班守则》CrewAI 任务模板
# 运行时通过 inputs={} 传入变量（花括号内的部分）

# ─────────────────────────────────────────
# 任务1：游戏机制设计
# 用法：crewai run --inputs '{"day_number": "Day 2", "previous_day_summary": "Day 1是...", "constraint": "需要测试证据协作能力"}'
# ─────────────────────────────────────────
game_mechanism_design:
  description: >
    为《夜班守则》S1 的 {day_number} 设计游戏机制。

    背景：
    - 这是一个CBD办公楼镜像空间里的六日入职考核
    - 游戏时间：早9点到晚9点（996隐喻）
    - 入侵者残余通过骗玩家违规来获得攻击资格
    - 违规 → 入侵者获得攻击权 → 身体被摧毁 → 意识锚定到物件
    - 规则必须用极度日常化的办公楼语境呈现（企业微信推送、员工守则）
    - 主角林深的核心能力：发现规则漏洞并利用

    前一天的情况：{previous_day_summary}

    本日设计要求：{constraint}

    产出要求：
    1. 游戏规则（用办公楼日常语言写，不用游戏术语）
    2. 入侵者残余的攻击/诱骗方式
    3. 规则的三层解读（字面遵守→理解逻辑→钻漏洞）
    4. 林深的通关策略（必须是观众能跟上的推理链）
    5. 1-2个"后背发凉"的高光场景
    6. 本日结尾钩子（驱动观众看下一集）
  expected_output: >
    包含完整游戏机制设计的文档：规则原文、入侵者攻击方式、
    三层规则解读、主角通关路径、高光场景描写、结尾钩子。
    中文输出，2000-3000字。
  agent: screenwriter

# ─────────────────────────────────────────
# 任务2：视觉分镜
# 接在游戏机制之后，拿编剧的产出做分镜
# ─────────────────────────────────────────
visual_breakdown:
  description: >
    基于编剧提供的 {day_number} 游戏机制，产出写实CG分镜方案。

    要求：
    1. 选出3-5个关键场景，每个场景给出：
       - 镜头类型（远/中/近/特写/主观视角/监控视角）
       - 画面描述（人物位置、表情、光影、环境细节）
       - 氛围关键词（供AI生图时使用）
       - CG可行性评估（这个画面AI能不能高质量生成）
    2. 标注哪个画面最适合做抖音封面图/缩略图
    3. 标注需要规避的画面（多人复杂动作、手部特写等AI弱项）

    场景环境：CBD办公楼——格子间、走廊、会议室、电梯、茶水间、天台。
    光影基调：深夜荧光灯冷白光，偶尔闪烁，阴影中有不该有的形状。
  expected_output: >
    3-5个关键场景的分镜方案，每个包含镜头、画面描述、
    氛围关键词、CG可行性评分。标注封面候选和规避项。
    中文输出。
  agent: visual_consultant
  context:
    - game_mechanism_design

# ─────────────────────────────────────────
# 任务3：审核与观众测试
# 拿前两个任务的产出做最终审核
# ─────────────────────────────────────────
story_audit:
  description: >
    审核编剧和视觉顾问为 {day_number} 产出的内容。

    审核维度：
    1. 【设定一致性】是否与以下已确认设定矛盾：
       - 守望者不能进入镜像空间
       - 只有违规才触发入侵者攻击
       - 规则启动后谁都不能改
       - 守望者不能逆转入侵者伤害
       - 玩家间直接暴力=违规
       - S1不出现"守望者""镜像空间""意识锚定"等术语
    2. 【观众吸引力】用25岁抖音用户的眼睛看：
       - 开头30秒能不能抓人？
       - 有没有"不看完不行"的悬念？
       - 有没有可以截图发朋友圈的名场面？
       - 有没有看不懂/需要暂停想的地方？（如果有，标红）
    3. 【综合建议】保留什么、改什么、砍什么

    严格但公正。好的地方要夸，烂的地方要直说。
  expected_output: >
    审核报告：设定一致性检查结果、观众吸引力评估、
    具体修改建议（保留/修改/删除）。中文输出。
  agent: story_auditor
  context:
    - game_mechanism_design
    - visual_breakdown

# ─────────────────────────────────────────
# 任务4：场景创作（独立任务，不依赖上面的链）
# 用法：crewai run --task scene_creation --inputs '{"scene_brief": "Day 6，女友主动握住笔..."}'
# ─────────────────────────────────────────
scene_creation:
  description: >
    创作《夜班守则》的一个具体场景。

    场景简述：{scene_brief}

    写作要求：
    - 用剧本格式（场景描述 + 对白 + 动作指示）
    - 对白必须口语化，像真人说话，不要书面腔
    - 每句对白不超过15个字（短视频节奏）
    - 恐怖感靠细节而不是jump scare
    - 适当加入黑色幽默（职场梗、自嘲吐槽）
    - 不出现任何设定术语（守望者、入侵者、镜像空间等）
  expected_output: >
    完整的场景剧本，包含场景描述、角色对白、动作指示、
    镜头建议。中文输出，500-1500字。
  agent: screenwriter

# ─────────────────────────────────────────
# 任务5：世界观讨论（开放式，三方辩论）
# 用法：crewai run --task worldbuilding_discuss --inputs '{"question": "锚定后的意识状态应该怎么设定？"}'
# ─────────────────────────────────────────
worldbuilding_discuss:
  description: >
    讨论《夜班守则》的一个世界观设定问题。

    问题：{question}

    已确认的核心设定（不能推翻）：
    - 入侵者通过骗你违规获得攻击资格
    - 被攻击后身体摧毁，意识锚定到物件
    - 高概念：人和物品的区别不是有没有意识，是有没有权利说"不"
    - S1是黑箱超自然——展示现象，不解释原理
    - 守望者是灰色功利主义者，不善不恶

    讨论要求：
    - 给出至少2个不同方案
    - 每个方案说清楚：核心设定、恐怖点、可视化场景、与已有设定的兼容性
    - 明确推荐一个，说清楚为什么
  expected_output: >
    2-3个设定方案的对比分析，附推荐理由。中文输出。
  agent: screenwriter
