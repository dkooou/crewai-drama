# Universal task template
# The manager reads the prompt and routes to the right agents.
# All specific requirements come through the {prompt} variable.

creative_task:
  description: >
    {prompt}

    Requirements:
    - Output in English (unless the user explicitly asks for Chinese)
    - If multiple approaches exist, compare them and recommend one
    - If writing a scene, use screenplay format (scene description + dialogue + action lines)
    - Dialogue must sound natural — like real people talking, not translated text
    - When referencing the Story Bible or prior episodes, cite specific details
  expected_output: >
    Complete deliverable addressing the task above. In English.
  agent: scene_writer
