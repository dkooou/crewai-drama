[project]
name = "nightshift-crew"
version = "0.2.0"
description = "AI Short Drama Dream Team — 13-agent CrewAI production system"
requires-python = ">=3.10"
dependencies = [
    "crewai[tools]>=0.100.0",
    "crewai-tools>=0.17.0",
    "python-dotenv>=1.0.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27.0",
]

[project.scripts]
nightshift = "nightshift_crew.main:run"
nightshift-bot = "nightshift_crew.bot:main"
nightshift-intel = "nightshift_crew.intelligence_cron:main"
